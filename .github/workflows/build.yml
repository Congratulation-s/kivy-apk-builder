name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Native Aidl
        run: |
          sudo apt-get update
          # 🔥 ส่วนสำคัญ: บังคับติดตั้ง aidl และ libstdc++6 ลงใน Linux หลักล่วงหน้าเพื่อตัดปัญหาเรื่องสัญญาลิขสิทธิ์
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev libstdc++6 aidl

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare Workspace Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK Directly
        run: |
          # 1. จำลองสร้างโฟลเดอร์โครงสร้างที่ Buildozer ตัวเก่ามองหา
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          
          # 2. ผูกลิงก์ (Symlink) เอาไฟล์ aidl จาก Linux แท้ที่เพิ่งติดตั้งมะกี้ เข้าไปเสิร์ฟให้ระบบภายในของ Buildozer โดยตรง
          ln -s /usr/bin/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
          
          # 3. สั่งข้ามผ่านตัวแปรระดับคำสั่งสากล
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          
          # 4. สั่งเริ่มบิลด์แอปพลิเคชัน
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
