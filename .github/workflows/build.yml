name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev libstdc++6 zip unzip libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer & Target Cython
        run: |
          pip install --quiet --upgrade pip
          # บังคับล็อกเสถียรภาพ Cython 3.x คู่กับ NDK r28c ยุคปัจจุบัน เพื่อแก้บั๊ก compile พังดื้อๆ
          pip install --quiet buildozer cython>=3.0.0

      - name: Prepare Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK Directly
        id: compile
        run: |
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          export P4A_python_version="3.11"
          
          # รันสร้างแอปแล้วบันทึกประวัติทั้งหมด
          buildozer -v android debug > full_build.log 2>&1

      - name: Extract Clean HTML Log If Failed
        # สคริปต์อัจฉริยะ: จะสกัดและพ่นเฉพาะ "เนื้อหา Error แท้ๆ ที่ไม่มีเครื่องหมาย # ปะปน" ออกมาโชว์ให้คุณเห็นไม่เกินครึ่งหน้าจอมือถือ
        if: failure()
        run: |
          echo "=========================================================="
          echo "🎯 ACTUAL ERROR LOG FOUND IN PROCESS:"
          echo "=========================================================="
          # กรองล้างประวัติขยะแวดล้อมและดึงจุดระเบิด 50 บรรทัดสุดท้ายออกแสดงผล
          grep -v -E "^#|^[[:space:]]*#" full_build.log | tail -n 50 || tail -n 30 full_build.log
          echo "=========================================================="

      - name: Upload Full Log Artifact
        # บังคับส่งประวัติ Log ฉบับเต็มออกเป็นปุ่มกดดาวน์โหลดให้คุณตรวจสอบบนมือถือได้ตลอดเวลา
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-debug-log
          path: full_build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
