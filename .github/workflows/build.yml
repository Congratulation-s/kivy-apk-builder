name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev libstdc++6 zip unzip

      - name: Install Buildozer
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet buildozer cython==0.29.33

      - name: Prepare Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK
        id: compile
        run: |
          # ตั้งค่าสภาพแวดล้อมบังคับยอมรับลิขสิทธิ์ของ Android ทุกเงื่อนไข
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          
          # 🔥 แก้ปัญหา Broken pipe: ถอดคำสั่ง 'yes |' ออกทั้งหมด แล้วสั่งรัน buildozer ตรงๆ เงียบๆ ลงไฟล์
          buildozer -v android debug > full_build.log 2>&1

      - name: Show Error Log Only If Failed
        if: failure()
        run: |
          echo "=========================================================="
          echo "❌ DETECTED BUILD FAILURE - SHOWING LAST 100 LINES OF LOG:"
          echo "=========================================================="
          tail -n 100 full_build.log
          echo "=========================================================="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
