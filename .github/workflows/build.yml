name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Locate App Files
        run: |
          # บังคับดึงไฟล์ใบสั่งประกอบแอปและโค้ดแอปมาสแตนบายไว้ที่หน้าแรกนอกสุดเพื่อความแม่นยำ 100%
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Build APK with Official Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: master
          command: buildozer -v android debug
          repository_root: .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
