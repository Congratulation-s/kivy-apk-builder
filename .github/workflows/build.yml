name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare Workspace Files
        run: |
          # ค้นหาและคัดลอกไฟล์การตั้งค่าไปไว้ตําแหน่งหลักชั้นนอกสุดเพื่อความถูกต้อง
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK Directly
        run: |
          # 1. สั่งยอมรับลิขสิทธิ์ทั้งหมดล่วงหน้าในขั้นตอนนี้โดยตรง
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          
          # 2. บังคับล็อกปิดการอัปเดตซ้ำซ้อนผ่านตัวแปรระดับคำสั่งสากล
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          
          # 3. รันคำสั่งคอมไพล์โปรเจกต์ Kivy ทันที
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
