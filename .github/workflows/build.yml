name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev unzip curl

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Inject Modern Android SDK Commandline Tools
        run: |
          # 1. บังคับย้ายไฟล์ใบสั่งและโค้ดแอปมาอยู่นอกสุดล่วงหน้า
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;
          
          # 2. จำลองสร้างโครงสร้างโฟลเดอร์แบบใหม่ที่ Google แนะนำสำหรับปี 2026
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # 3. ดาวน์โหลดชุดเครื่องมือ Commandline Tools เวอร์ชันอัปเดตรองรับ Java รุ่นใหม่โดยตรงจากคลัง Google
          curl -O https://google.com
          
          # 4. แตกไฟล์นำโครงสร้างคอมไพเลอร์ตัวใหม่ไปประกบไว้ในจุดที่แอปเรียกหา
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools/* /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          
          # 5. ล้างไฟล์ขยะและสร้างโฟลเดอร์สำหรับจำลองลิงก์เก่าหลอกเครื่องมือ Buildozer 
          rm -rf cmdline-tools commandlinetools-linux-11076708_latest.zip
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # 6. บังคับกดยอมรับลิขสิทธิ์สากลล่วงหน้าด้วยเครื่องมือเวอร์ชันใหม่ผ่านฉลุย 100%
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK Final Stage
        run: |
          # ดำเนินการประกอบแอปพลิเคชันอย่างเป็นทางการโดยมีไฟล์เครื่องมือรองรับครบถ้วน
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
