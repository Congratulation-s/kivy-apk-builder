name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Build APK with Production Buildozer Action
        # 🔥 สลับมาใช้เครื่องมือเบาพิเศษสากล ป้องกัน RAM ฝั่งคลาวด์เต็มและเคลียร์บั๊กพังดื้อๆ
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: stable
        env:
          # สั่งล็อกไม่ให้ตัวคอนเทนเนอร์วิ่งอัปเดตตัวเองซ้ำซ้อนจนเครื่องค้าง
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
          APP_ANDROID_SKIP_UPDATE: "True"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
