name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev unzip wget

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Pre-Configure Android SDK and Accept Licenses
        run: |
          # 1. บังคับย้ายไฟล์ใบสั่งและโค้ดแอปมาอยู่นอกสุดล่วงหน้าเพื่อความถูกต้อง
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;
          
          # 2. จำลองการสร้างโครงสร้างโฟลเดอร์สำหรับ Android SDK เวอร์ชันปี 2026
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # 3. เปลี่ยนมาใช้ wget ดาวน์โหลดตัวช่วยคอมไพเลอร์จาก Google เพื่อป้องกัน Error 23
          wget -q https://google.com
          
          # 4. แตกไฟล์นำโครงสร้างคอมไพเลอร์ตัวใหม่ไปประกบไว้ในจุดที่เหมาะสม
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools/* /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools commandlinetools-linux-11076708_latest.zip
          
          # 5. ทำการเชื่อมโยงระบบเก่า (Symlink) เพื่อหลอกโปรแกรมต้นทางให้มองเห็นโฟลเดอร์ครบถ้วน
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # 6. กดยอมรับลิขสิทธิ์สากลล่วงหน้าทุกรูปแบบ
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK Final Stage
        run: |
          # เริ่มต้นประกอบแอปพลิเคชันอย่างเป็นทางการแบบสะอาดหมดจด
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
