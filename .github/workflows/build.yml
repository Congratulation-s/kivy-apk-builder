name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare Workspace Files
        run: |
          # ค้นหาและดึงไฟล์คอนฟิกหลักมาไว้ที่โฟลเดอร์นอกสุดเพื่อไม่ให้ Buildozer หามันไม่เจอ
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Build APK with Auto-Path Injection
        env:
          # 🔥 ส่วนสำคัญ: บังคับส่งค่าโครงสร้างระบบจริงให้ทูลเชนรับทราบโดยไม่ต้องใช้ Symlink
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_AUTO_ACCEPT_SDK_LICENSES: 'true'
        run: |
          # ยอมรับข้อตกลงลิขสิทธิ์ทั้งหมดของ SDK ผ่านทูลเชนมาตรฐานระบบก่อนเริ่มทำงาน
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # ส่งผ่านค่าตัวแปรตำแหน่งระบบลงไปในขณะสั่งรันคำสั่งแพ็กเกจ Buildozer
          export ANDROID_SDK_PATH="$ANDROID_HOME"
          export ANDROID_NDK_PATH="$ANDROID_HOME/ndk/27.3.13750724"
          
          # เริ่มต้นกระบวนการคอมไพล์แอปพลิเคชัน
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
