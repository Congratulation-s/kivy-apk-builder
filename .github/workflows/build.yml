name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev unzip curl

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Inject Android SDK Commandline Tools (Fix SDK Error)
        run: |
          # 1. บังคับวางไฟล์โค้ดหลักและไฟล์ใบสั่งให้มาอยู่นอกสุดล่วงหน้า
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;
          
          # 2. จำลองการสร้างโครงสร้างโฟลเดอร์ที่ Buildozer ร้องหาล่วงหน้า
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          
          # 3. ดาวน์โหลดชุดเครื่องมือจัดแจงลิขสิทธิ์สากลเวอร์ชันทางการจาก Google Repository
          curl -O https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          
          # 4. แตกไฟล์นำโครงสร้างโฟลเดอร์ 'tools' ย่อยไปประกบไว้ในจุดที่แอปเรียกหา
          unzip -q sdk-tools-linux-4333796.zip -d /home/runner/.buildozer/android/platform/android-sdk/
          
          # 5. ล้างไฟล์ขยะรักษาสภาพแวดล้อมระบบคลาวด์
          rm sdk-tools-linux-4333796.zip
          
          # 6. บังคับยิงสิทธิ์กดยอมรับสัญญาอนุญาตล่วงหน้าแก่ทุก API ทันที
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Build APK Final Stage
        run: |
          # เริ่มต้นประกอบแอปพลิเคชันอย่างเป็นทางการโดยมีไฟล์เครื่องมือสแตนบายรอครบถ้วนแล้ว
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
