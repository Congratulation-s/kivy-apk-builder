name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Official Android SDK
        # ดึงเครื่องมือและระบบจัดการ SDK จัดวางระบบเตรียมพร้อมใช้งานล่วงหน้า
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare Workspace Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK Directly
        run: |
          # 1. จัดสรรและส่งค่าตำแหน่งเครื่องมือสากลจากระเบียบระบบให้ Buildozer รับทราบ
          export ANDROID_SDK_PATH="$ANDROID_HOME"
          
          # ค้นหาตำแหน่งโฟลเดอร์ NDK บนเครื่องและดึงส่งเข้าตัวแปรระบบอัตโนมัติ
          export ANDROID_NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | head -n 1)
          
          # 2. กดยอมรับลิขสิทธิ์ความปลอดภัยในระบบ SDK แท้ทั้งหมดล่วงหน้า
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 3. บังคับยิงสิทธิ์กดยอมรับสัญญาอนุญาตผ่านตัวแปรระดับคำสั่งสากล
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          
          # 4. เริ่มคอมไพล์ โดย Buildozer จะเข้าดึงไฟล์ 'aidl' จากตําแหน่งระบบแท้ไปใช้ทันที
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
