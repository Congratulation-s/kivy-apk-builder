name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev libstdc++6 zip unzip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare Workspace Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK Directly
        run: |
          # สร้างโครงสร้างข้อมูลล่วงหน้าเพื่อตอบรับสิทธิ์ลิขสิทธิ์ของ Google
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          
          # บังคับระบบส่งคำสั่งอนุญาตทุกเงื่อนไขโดยอัตโนมัติ
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          
          # สั่งให้ Buildozer สร้างไฟล์ APK ในโหมดดั้งเดิม (ระบบจะเคลียร์ปัญหา sdkmanager/aidl ตัวเองทั้งหมด)
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
