name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # สั่งรันเงียบๆ (ใส่ -qq) เพื่อลดปริมาณตัวอักษรบนหน้าจอเว็บ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev libstdc++6 zip unzip

      - name: Install Buildozer
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet buildozer cython==0.29.33

      - name: Prepare Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK
        run: |
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          # 🔥 บังคับบันทึก Log ยาวๆ ลงไฟล์ full_build.log แทนการแสดงบนหน้าเว็บ (เว็บจะไม่เด้งแน่นอน)
          yes | buildozer -v android debug > full_build.log 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
