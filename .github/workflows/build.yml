name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Buildozer Global Directory
        # ป้องกันปัญหาระบบคลาวด์ดาวน์โหลดหลุด และเร่งความเร็วในการบิลด์รอบถัดไป
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Prepare Workspace Files
        run: |
          # บังคับดึงไฟล์การตั้งค่ามาจัดวางตำแหน่งนอกสุดให้ถูกต้องล่วงหน้า
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Build APK with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: stable
        env:
          # 🔥 บังคับสั่ง override บรรทัดปัญหาจากด้านนอก เพื่อแก้บั๊ก Docker ล่ม และยอมรับสัญญาลิขสิทธิ์ทั้งหมดอัตโนมัติ
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
          APP_ANDROID_SKIP_UPDATE: "True"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
