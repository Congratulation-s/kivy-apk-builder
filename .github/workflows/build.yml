name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Official Android SDK Tools
        # ดึงเครื่องมือจัดสรรระบบแอนดรอยด์แท้ที่มีโปรแกรมคอมไพล์เสร็จสรรพมาสแตนบายรอไว้
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y scons build-essential python3-dev libffi-dev ssl-cert autoconf automake libtool pkg-config libltdl-dev zlib1g-dev libncurses5-dev libsqlite3-dev libstdc++6 zip unzip libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet buildozer cython>=3.0.0

      - name: Prepare Files
        run: |
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Compile Kivy APK Directly
        id: compile
        run: |
          # บังคับกดยอมรับสัญญาอนุญาตผ่านระดับสากล
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES="true"
          export P4A_python_version="3.11"
          
          # 🔥 ไม้ตายสยบบั๊ก: บังคับจ่ายตำแหน่งเครื่องมือระบบแท้เข้าสู่ Buildozer โดยตรง ห้ามดาวน์โหลดหลอกซ้ำซ้อน
          export ANDROID_SDK_PATH="$ANDROID_HOME"
          export ANDROID_NDK_PATH="$ANDROID_HOME/ndk/27.3.13750724"
          
          # สั่งรันจัดระเบียบและแปลงแอปทันที
          buildozer -v android debug > full_build.log 2>&1

      - name: Show Clean Error Log If Failed
        if: failure()
        run: |
          echo "=========================================================="
          echo "🎯 ACTUAL COMPILATION ERROR LOG:"
          echo "=========================================================="
          # กรองล้างประวัติขยะแวดล้อมและพ่นเฉพาะจุดที่ระบบผิดพลาดจริงออกแสดงผลสั้นๆ
          grep -v -E "^#|^[[:space:]]*#" full_build.log | tail -n 40 || tail -n 25 full_build.log
          echo "=========================================================="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
