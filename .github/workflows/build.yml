name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Workspace Files
        run: |
          # บังคับย้ายไฟล์คอนฟิกมาอยู่ที่โฟลเดอร์ด้านนอกสุดเพื่อป้องกันปัญหา Path หาไฟล์ไม่เจอ
          find . -name "buildozer.spec" -exec cp {} . \;
          find . -name "main.py" -exec cp {} . \;

      - name: Build APK with Buildozer Action
        uses: ArtemGovorov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: stable
        env:
          # 🔥 บังคับแมปตำแหน่ง SDK/NDK แท้ของ Ubuntu Runner เข้าสู่ Core ของ Action โดยตรง
          ANDROID_SDK_PATH: /usr/local/lib/android/sdk
          ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/27.3.13750724

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-player-apk
          path: bin/*.apk
